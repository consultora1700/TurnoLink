<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background (no rounded corners - launcher applies its own mask) -->
  <rect width="512" height="512" fill="#0A0A0A"/>
  <!-- Content scaled to 70% and centered in the safe area -->
  <g transform="translate(256 256) scale(0.7) translate(-256 -256)">
    <text
      x="16" y="355"
      text-anchor="start"
      font-family="Arial Black, Impact, Arial, Helvetica, sans-serif"
      font-weight="900"
      font-size="175"
      fill="white"
    >T</text>
    <text
      x="140" y="355"
      text-anchor="start"
      font-family="Arial Black, Impact, Arial, Helvetica, sans-serif"
      font-weight="900"
      font-size="175"
      fill="#14B8A6"
    >Link</text>
  </g>
</svg>
